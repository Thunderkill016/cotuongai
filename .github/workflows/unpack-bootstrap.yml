name: Unpack bootstrap source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/unpack-bootstrap.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and unpack source
        shell: bash
        run: |
          set -euo pipefail

          chunks=(
            .bootstrap/chunk_00
            .bootstrap/chunk_01
            .bootstrap/chunk_02
            .bootstrap/chunk_03
            .bootstrap/chunk_04a
            .bootstrap/chunk_05
            .bootstrap/chunk_06
          )

          : > /tmp/cotuong-source.b64
          for chunk in "${chunks[@]}"; do
            test -f "$chunk"
            echo "$(basename "$chunk"): $(wc -c < "$chunk") bytes"
            tr -d '[:space:]' < "$chunk" >> /tmp/cotuong-source.b64
          done

          echo "Normalized base64 bytes: $(wc -c < /tmp/cotuong-source.b64)"
          base64 --decode /tmp/cotuong-source.b64 > /tmp/cotuong-source.gz
          gzip -t /tmp/cotuong-source.gz
          gzip -dc /tmp/cotuong-source.gz > /tmp/cotuong-source.tar

          echo "Archive preview:"
          tar -tf /tmp/cotuong-source.tar | head -100

          rm -rf /tmp/cotuong-unpacked
          mkdir -p /tmp/cotuong-unpacked
          tar -xf /tmp/cotuong-source.tar \
            --exclude=".git" \
            --exclude="./.git" \
            --exclude="node_modules" \
            --exclude="*/node_modules" \
            -C /tmp/cotuong-unpacked

          shopt -s dotglob nullglob
          entries=(/tmp/cotuong-unpacked/*)

          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ] && [ -f "${entries[0]}/package.json" ]; then
            echo "Single project directory detected: ${entries[0]}"
            cp -a "${entries[0]}/." .
          else
            cp -a /tmp/cotuong-unpacked/. .
          fi

          rm -rf .bootstrap
          rm -f .github/workflows/unpack-bootstrap.yml

          echo "Resulting repository root:"
          find . -maxdepth 2 -type f \
            -not -path "./.git/*" \
            | sort | head -200

          test -f package.json

      - name: Commit unpacked application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: unpack application source"
          git push origin HEAD:main
