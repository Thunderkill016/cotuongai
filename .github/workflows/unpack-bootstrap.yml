name: Recover application source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/cotuongai-m2.zip"
      - ".github/workflows/unpack-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify and unpack recovery archive
        shell: bash
        run: |
          set -euo pipefail
          archive=.bootstrap/cotuongai-m2.zip
          test -f "$archive"
          unzip -t "$archive"
          rm -rf /tmp/cotuong-recovery
          mkdir -p /tmp/cotuong-recovery
          unzip -q "$archive" -d /tmp/cotuong-recovery
          root=/tmp/cotuong-recovery/cotuongai-m2
          test -f "$root/package.json"
          test -f "$root/package-lock.json"
          test -f "$root/src/App.tsx"
          shopt -s dotglob nullglob
          cp -a "$root"/. .
          rm -rf .bootstrap
          rm -f .github/workflows/unpack-bootstrap.yml

      - name: Validate recovered application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run quality

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          test -f package.json
          test ! -d .bootstrap
          git commit -m "chore: restore application source"
          git push origin HEAD:main
