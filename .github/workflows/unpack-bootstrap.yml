name: Recover application source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/recovery-ready"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Reconstruct and unpack verified recovery archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/recovery-ready
          cat .bootstrap/recovery_chunk_00 \
              .bootstrap/recovery_chunk_01 \
              .bootstrap/recovery_chunk_02 \
              .bootstrap/recovery_chunk_03 \
              .bootstrap/recovery_chunk_04 \
              .bootstrap/recovery_chunk_05 \
              .bootstrap/recovery_chunk_06 \
              .bootstrap/recovery_chunk_07 \
              .bootstrap/recovery_chunk_08 > /tmp/cotuongai-m2.b64
          test "$(wc -c < /tmp/cotuongai-m2.b64)" -eq 136984
          printf '%s  %s\n' '50a33042ae82363a85a4c8b0d41fa7cdc1d56f303295ca4734f24f2cd079aacd' '/tmp/cotuongai-m2.b64' | sha256sum -c -
          base64 --decode /tmp/cotuongai-m2.b64 > /tmp/cotuongai-m2.zip
          printf '%s  %s\n' 'c5c39cb418ce750f0627c4f815e4cb3c4487651cbea4205d8af13c2baf6c3f67' '/tmp/cotuongai-m2.zip' | sha256sum -c -
          unzip -t /tmp/cotuongai-m2.zip
          rm -rf /tmp/cotuong-recovery
          mkdir -p /tmp/cotuong-recovery
          unzip -q /tmp/cotuongai-m2.zip -d /tmp/cotuong-recovery
          root=/tmp/cotuong-recovery/cotuongai-m2
          test -f "$root/package.json"
          test -f "$root/package-lock.json"
          test -f "$root/src/App.tsx"
          shopt -s dotglob nullglob
          cp -a "$root"/. .
          rm -rf .bootstrap
          rm -f .github/workflows/unpack-bootstrap.yml

      - name: Validate recovered application
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run quality

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          test -f package.json
          test ! -d .bootstrap
          git commit -m "chore: restore application source"
          git push origin HEAD:main
