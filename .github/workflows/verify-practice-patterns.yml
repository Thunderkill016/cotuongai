name: Verify practice patterns

on:
  push:
    branches: ["feat/practice-pattern-profile-v1"]

permissions:
  contents: write

jobs:
  quality:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add recurring evidence profile to Today Practice
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/TodayPractice.tsx")
          text = path.read_text()

          old = '''} from "./practiceMemory";\nimport "./today.css";\n'''
          new = '''} from "./practiceMemory";\nimport {\n  patternEvidenceLabel,\n  profileSampleNote,\n  summarizePracticePatterns,\n} from "./practicePatterns";\nimport "./today.css";\n'''
          if old not in text:
              raise SystemExit("pattern import anchor missing")
          text = text.replace(old, new, 1)

          old = '''  const dueCount = duePracticeCount(cards, now);\n  const game = useMemo(() => {\n'''
          new = '''  const dueCount = duePracticeCount(cards, now);\n  const evidenceProfile = summarizePracticePatterns(cards, now);\n  const visiblePatterns = evidenceProfile.patterns\n    .filter((pattern) => pattern.negativePositions > 0 || pattern.failedAttempts > 0)\n    .slice(0, 3);\n  const game = useMemo(() => {\n'''
          if old not in text:
              raise SystemExit("profile derive anchor missing")
          text = text.replace(old, new, 1)

          old = '''              <section className="today-history-note">\n                <RefreshCw size={15} />\n'''
          new = '''              <section className="today-pattern-profile" aria-label="Dấu hiệu lặp lại từ các ván đã lưu">\n                <div className="section-label">\n                  <span>DẤU HIỆU TRONG CÁC VÁN ĐÃ LƯU</span>\n                  <small>{evidenceProfile.totalPositions} thế</small>\n                </div>\n                <p className="today-pattern-caveat">\n                  {profileSampleNote(evidenceProfile.sample)}\n                </p>\n                {visiblePatterns.length ? (\n                  <div className="today-pattern-list">\n                    {visiblePatterns.map((pattern) => (\n                      <article key={pattern.tag} className={`today-pattern-item evidence-${pattern.evidence}`}>\n                        <div>\n                          <strong>{pattern.label}</strong>\n                          <span>{patternEvidenceLabel(pattern)}</span>\n                        </div>\n                        <dl>\n                          <div>\n                            <dt>Thế độc lập</dt>\n                            <dd>{pattern.positions}</dd>\n                          </div>\n                          <div>\n                            <dt>Lần ôn sai</dt>\n                            <dd>{pattern.failedAttempts}</dd>\n                          </div>\n                          <div>\n                            <dt>Đến hạn</dt>\n                            <dd>{pattern.duePositions}</dd>\n                          </div>\n                        </dl>\n                      </article>\n                    ))}\n                  </div>\n                ) : (\n                  <p className="muted">Chưa có tín hiệu lỗi đủ để xếp hạng. Nước tốt vẫn được lưu để ôn nhưng không bị biến thành “điểm yếu”.</p>\n                )}\n              </section>\n\n              <section className="today-history-note">\n                <RefreshCw size={15} />\n'''
          if old not in text:
              raise SystemExit("profile UI anchor missing")
          text = text.replace(old, new, 1)
          path.write_text(text)

          css = Path("src/today.css")
          css_text = css.read_text()
          marker = ".today-pattern-profile {"
          if marker not in css_text:
              css_text += '''\n\n.today-pattern-profile {\n  padding: 18px;\n  border: 1px solid #dfe3db;\n  border-radius: 10px;\n  background: #fbfaf5;\n}\n\n.today-pattern-profile .section-label {\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n}\n\n.today-pattern-profile .section-label small {\n  color: #858d85;\n}\n\n.today-pattern-caveat {\n  margin: 10px 0 14px;\n  color: #68736b;\n  font-size: 11px;\n  line-height: 1.7;\n}\n\n.today-pattern-list {\n  display: grid;\n  gap: 8px;\n}\n\n.today-pattern-item {\n  padding: 11px 12px;\n  border: 1px solid #e0e4dc;\n  border-left: 3px solid #aab4ac;\n  border-radius: 7px;\n  background: #fffefa;\n}\n\n.today-pattern-item.evidence-recurring {\n  border-left-color: #a64032;\n}\n\n.today-pattern-item.evidence-repeated {\n  border-left-color: #b18a50;\n}\n\n.today-pattern-item > div:first-child {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 10px;\n}\n\n.today-pattern-item strong {\n  color: var(--green);\n  font-size: 13px;\n}\n\n.today-pattern-item > div:first-child span {\n  color: #777f78;\n  font-size: 9px;\n  text-transform: uppercase;\n  letter-spacing: .7px;\n}\n\n.today-pattern-item dl {\n  display: grid;\n  grid-template-columns: repeat(3, minmax(0, 1fr));\n  gap: 6px;\n  margin: 9px 0 0;\n}\n\n.today-pattern-item dl div {\n  display: grid;\n  gap: 2px;\n}\n\n.today-pattern-item dt {\n  color: #8b928c;\n  font-size: 9px;\n}\n\n.today-pattern-item dd {\n  margin: 0;\n  color: #46584e;\n  font-weight: 700;\n  font-size: 12px;\n}\n'''
              css.write_text(css_text)
          PY
      - name: Format pattern-profile source
        run: npx prettier --write src/practicePatterns.ts tests/practicePatterns.test.ts src/TodayPractice.tsx src/today.css
      - name: Keep dependency audit clean
        run: npm audit --audit-level=high
      - name: Full quality gate
        run: npm run quality
      - name: Commit verified pattern profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/practicePatterns.ts tests/practicePatterns.test.ts src/TodayPractice.tsx src/today.css
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: show recurring evidence from reviewed games"
            git push origin HEAD:feat/practice-pattern-profile-v1
          fi
