name: Apply and Verify 3D Combat Cues

on:
  push:
    branches: ["feat/3d-combat-cues-v1"]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wire deterministic cues into board and 3D renderer
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/Board2D.tsx",
              'import { FILES, GLYPHS, pieceName, position, squareAt } from "./chess";\n',
              'import { FILES, GLYPHS, pieceName, position, squareAt } from "./chess";\nimport type { BattleCue } from "./battleCue";\n',
          )
          replace(
              "src/Board2D.tsx",
              '  lastMove?: string | null;\n  onSquare: (sq: string) => void;\n',
              '  lastMove?: string | null;\n  moveEffect?: BattleCue | null;\n  onSquare: (sq: string) => void;\n',
          )

          replace(
              "src/PlayVsAI.tsx",
              'import { Board } from "./Board";\n',
              'import { Board } from "./Board";\nimport { deriveBattleCue } from "./battleCue";\n',
          )
          replace(
              "src/PlayVsAI.tsx",
              '  const displayedLastMove = reviewMoves.at(-1) ?? null;\n  const destinations =\n',
              '''  const displayedLastMove = reviewMoves.at(-1) ?? null;\n  const displayedMoveEffect = useMemo(() => {\n    if (!displayedLastMove) return null;\n    return deriveBattleCue(\n      fenAfter(reviewMoves.slice(0, -1)),\n      displayedLastMove,\n    );\n  }, [displayedLastMove, reviewPly, moves]);\n  const destinations =\n''',
          )
          replace(
              "src/PlayVsAI.tsx",
              '              lastMove={displayedLastMove}\n              onSquare={clickSquare}\n',
              '              lastMove={displayedLastMove}\n              moveEffect={displayedMoveEffect}\n              onSquare={clickSquare}\n',
          )

          replace(
              "src/Battlefield3DEnhanced.tsx",
              '  lastMove,\n  onSquare,\n',
              '  lastMove,\n  moveEffect,\n  onSquare,\n',
          )
          replace(
              "src/Battlefield3DEnhanced.tsx",
              '''        if (object.userData.flag)\n          object.rotation.y =\n            Math.sin(now / 430 + object.userData.phase) * 0.12;\n''',
              '''        if (object.userData.fade) {\n          const duration = object.userData.duration || 520;\n          const age = (now - object.userData.startedAt) / duration;\n          const faded = object as THREE.Mesh;\n          const mat = faded.material as THREE.MeshBasicMaterial;\n          if (age <= 1) mat.opacity = Math.max(0, 0.9 * (1 - age));\n          else object.visible = false;\n        }\n        if (object.userData.checkFlash) {\n          const age = (now - object.userData.startedAt) / 1250;\n          const ring = object as THREE.Mesh;\n          const mat = ring.material as THREE.MeshBasicMaterial;\n          if (age <= 1) {\n            const beat = 1 + Math.sin(age * Math.PI * 5) * 0.18;\n            ring.scale.setScalar(beat);\n            mat.opacity = Math.max(0.18, 0.9 * (1 - age * 0.72));\n          } else object.visible = false;\n        }\n        if (object.userData.flag)\n          object.rotation.y =\n            Math.sin(now / 430 + object.userData.phase) * 0.12;\n''',
          )
          replace(
              "src/Battlefield3DEnhanced.tsx",
              '    if (arrow && /^[a-i][0-9][a-i][0-9]$/.test(arrow)) {\n',
              '''    if (animateThisMove && lastMove && moveEffect) {\n      const effectStartedAt = performance.now();\n      const [tx, tz] = squareToWorld(moveEffect.to, flipped);\n\n      if (moveEffect.capture) {\n        const impact = new THREE.Mesh(\n          new THREE.RingGeometry(0.18, 0.42, 32),\n          new THREE.MeshBasicMaterial({\n            color: moveEffect.kind === "cannon-shot" ? "#e8b35f" : "#bd5747",\n            transparent: true,\n            opacity: 0.82,\n            side: THREE.DoubleSide,\n            depthWrite: false,\n          }),\n        );\n        impact.rotation.x = -Math.PI / 2;\n        impact.position.set(tx, 0.2, tz);\n        impact.userData.flash = true;\n        impact.userData.startedAt = effectStartedAt;\n        root.add(impact);\n      }\n\n      if (moveEffect.kind === "cannon-shot") {\n        const [sx, sz] = squareToWorld(moveEffect.from, flipped);\n        const dx = tx - sx;\n        const dz = tz - sz;\n        const length = Math.hypot(dx, dz);\n        const tracer = mesh(\n          new THREE.BoxGeometry(0.07, 0.07, Math.max(0.12, length)),\n          new THREE.MeshBasicMaterial({\n            color: "#ffd88a",\n            transparent: true,\n            opacity: 0.92,\n            depthWrite: false,\n          }),\n          [(sx + tx) / 2, 0.62, (sz + tz) / 2],\n        );\n        tracer.rotation.y = Math.atan2(dx, dz);\n        tracer.userData.fade = true;\n        tracer.userData.startedAt = effectStartedAt;\n        tracer.userData.duration = 470;\n        root.add(tracer);\n\n        if (moveEffect.cannonScreenSquare) {\n          const [gx, gz] = squareToWorld(moveEffect.cannonScreenSquare, flipped);\n          const screen = new THREE.Mesh(\n            new THREE.RingGeometry(0.28, 0.38, 28),\n            new THREE.MeshBasicMaterial({\n              color: COLORS.select,\n              transparent: true,\n              opacity: 0.78,\n              side: THREE.DoubleSide,\n              depthWrite: false,\n            }),\n          );\n          screen.rotation.x = -Math.PI / 2;\n          screen.position.set(gx, 0.18, gz);\n          screen.userData.flash = true;\n          screen.userData.startedAt = effectStartedAt;\n          root.add(screen);\n        }\n      }\n\n      if (moveEffect.givesCheck && moveEffect.checkedKingSquare) {\n        const [kx, kz] = squareToWorld(moveEffect.checkedKingSquare, flipped);\n        const check = new THREE.Mesh(\n          new THREE.RingGeometry(0.42, 0.58, 36),\n          new THREE.MeshBasicMaterial({\n            color: "#c84035",\n            transparent: true,\n            opacity: 0.9,\n            side: THREE.DoubleSide,\n            depthWrite: false,\n          }),\n        );\n        check.rotation.x = -Math.PI / 2;\n        check.position.set(kx, 0.19, kz);\n        check.userData.checkFlash = true;\n        check.userData.startedAt = effectStartedAt;\n        root.add(check);\n      }\n    }\n\n    if (arrow && /^[a-i][0-9][a-i][0-9]$/.test(arrow)) {\n''',
          )
          replace(
              "src/Battlefield3DEnhanced.tsx",
              '  }, [fen, selected, destinations, arrow, lastMove, flipped, tutorialSquares]);\n',
              '  }, [fen, selected, destinations, arrow, lastMove, moveEffect, flipped, tutorialSquares]);\n',
          )
          replace(
              "src/Battlefield3DEnhanced.tsx",
              '''        <span>\n          Nước đi có chuyển động · Kéo: xoay · Cuộn: zoom · Chạm: ra lệnh\n        </span>\n''',
              '''        <span>\n          {moveEffect?.givesCheck\n            ? "Chiếu Tướng · vùng Tướng bị uy hiếp đang được đánh dấu"\n            : moveEffect?.kind === "cannon-shot"\n              ? "Pháo khai hỏa · vòng sáng chỉ quân làm ngòi"\n              : moveEffect?.capture\n                ? "Nước ăn quân · điểm va chạm đang được đánh dấu"\n                : "Nước đi có chuyển động · Kéo: xoay · Cuộn: zoom · Chạm: ra lệnh"}\n        </span>\n''',
          )
          PY
      - name: Format changed source
        run: npx prettier --write src/Board2D.tsx src/PlayVsAI.tsx src/Battlefield3DEnhanced.tsx src/battleCue.ts tests/battleCue.test.ts
      - name: Full quality gate
        run: npm run quality
      - name: Commit verified 3D combat cues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Board2D.tsx src/PlayVsAI.tsx src/Battlefield3DEnhanced.tsx src/battleCue.ts tests/battleCue.test.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: connect deterministic combat cues to 3D battlefield"
            git push origin HEAD:feat/3d-combat-cues-v1
          fi
