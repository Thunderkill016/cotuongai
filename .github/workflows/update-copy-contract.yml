name: Update Vietnamese copy contract
on:
  push:
    branches: ["feat/natural-vietnamese-copy"]
permissions:
  contents: write
jobs:
  patch-test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update copy assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/core.test.ts')
          s=p.read_text()
          old='expect(recommendation.reason).toContain("trợ giúp");'
          new='expect(recommendation.reason).toContain("gợi ý");'
          assert old in s
          p.write_text(s.replace(old,new,1))
          PY
          npm run format -- --write tests/core.test.ts
      - name: Commit test contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/core.test.ts
          git commit -m "test: expect natural hint wording"
          git push origin HEAD:feat/natural-vietnamese-copy
