name: Integrate M3 recommendation

on:
  push:
    branches: ["feat/m3-spaced-retrieval"]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire spaced retrieval into App
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          s = s.replace('  recommendExercise,\n', '')
          marker = 'import { requestCoaching } from "./coach";'
          addition = marker + '\nimport { recommendNextPractice } from "./retrieval";'
          if 'recommendNextPractice' not in s:
              s = s.replace(marker, addition)
          s = s.replace(
              'const recommendation = recommendExercise(attempts, exposuresInMemory.current);',
              'const recommendation = recommendNextPractice(\n    attempts,\n    exposuresInMemory.current,\n  );',
          )
          p.write_text(s)
          PY
      - name: Verify integrated tree
        run: |
          npm ci
          npm run quality
      - name: Commit App integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "feat: use spaced retrieval for next practice"
          git push origin HEAD:feat/m3-spaced-retrieval
