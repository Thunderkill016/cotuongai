name: Bootstrap M2 source

on:
  push:
    branches: ["bootstrap/m2-source"]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified source archive
        run: |
          cat .bootstrap/part-* > source.b64
          base64 -d source.b64 > source.tgz
          echo "ae12110024f40ad15a8a164d80c88fa2a8f05f04c20b8b803c84734c9b6bfad5  source.tgz" | sha256sum -c -
      - name: Replace bootstrap with source tree
        run: |
          rm -rf .bootstrap source.b64
          tar xzf source.tgz
          rm source.tgz
      - name: Verify project
        run: |
          npm ci
          npm run quality
      - name: Commit reconstructed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import verified M2 Xiangqi Coach source"
          git push origin HEAD:bootstrap/m2-source
