name: Verify Full Game

on:
  push:
    branches: ["feat/full-game-vs-pikafish-v1"]

permissions:
  contents: write

jobs:
  quality:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format full-game source
        run: npx prettier --write src/gameSession.ts src/PlayVsAI.tsx src/Root.tsx
      - name: Full quality gate
        run: npm run quality
      - name: Commit verified formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/gameSession.ts src/PlayVsAI.tsx src/Root.tsx
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "chore: format verified full-game source"
            git push origin HEAD:feat/full-game-vs-pikafish-v1
          fi
