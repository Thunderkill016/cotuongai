name: Rewrite Vietnamese Xiangqi copy
on:
  push:
    branches: ["feat/natural-vietnamese-copy"]
permissions:
  contents: write
jobs:
  rewrite:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply terminology and copy rewrite
        run: |
          python - <<'PY'
          from pathlib import Path

          def apply(path, pairs):
              p = Path(path)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f"Missing text in {path}: {old}")
                  s = s.replace(old, new)
              p.write_text(s)

          apply('src/training.ts', [
              ('label: "Kiểm tra bắt lại",', 'label: "Có bị ăn lại không?",'),
              ('description: "Sau một nước bắt, tìm nước đối phương có thể bắt lại ngay.",', 'description: "Sau khi ăn quân, nhìn xem đối thủ có thể ăn lại ngay không.",'),
              ('description: "Nhìn đường thẳng, vật cản và mục tiêu của Xe.",', 'description: "Xe đi ngang hoặc dọc; chỉ cần để ý quân chắn đường.",'),
              ('label: "Giá Pháo",', 'label: "Ngòi Pháo",'),
              ('description: "Đếm đúng một quân làm giá khi Pháo bắt quân.",', 'description: "Khi Pháo ăn quân, giữa Pháo và mục tiêu phải có đúng một quân làm ngòi.",'),
              ('description: "Kiểm tra chân Mã trước khi tính nước đi hình chữ nhật.",', 'description: "Nhìn chân Mã trước: chân bị chặn thì Mã không đi được hướng đó.",'),
              ('concept: "Quan sát quân có thể bắt",', 'concept: "Tìm quân có thể ăn",'),
              ('"Đỏ đi. Tìm một nước bắt quân mà đối phương không thể bắt lại ngay quân vừa đi."', '"Đỏ đi. Hãy ăn một quân Đen mà quân vừa đi không bị ăn lại ngay."'),
              ('"Xe đi thẳng theo hàng hoặc cột khi không có quân chắn."', '"Xe đi ngang hoặc dọc, miễn là không có quân chắn đường."'),
              ('"Nhìn cùng cột với Xe đỏ: giữa Xe và Mã đen có quân nào không?"', '"Nhìn cùng cột với Xe đỏ. Giữa Xe và Mã đen có quân nào chắn không?"'),
              ('"Thử đưa Xe từ b0 đến b3, rồi kiểm tra các nước bắt lại của Đen."', '"Thử Xe b0 ăn Mã b3. Sau đó nhìn xem Đen có quân nào ăn lại Xe được không."'),
              ('"Xe từ b0 bắt Mã ở b3 qua một đường trống. Trong thế cờ này, Đen không có nước hợp lệ bắt lại Xe ngay lượt kế tiếp."', '"Xe b0 ăn Mã b3 vì đường đi không bị chắn. Trong thế này, Đen không ăn lại Xe ngay được."'),
              ('title: "Một giá Pháo",', 'title: "Tìm ngòi cho Pháo",'),
              ('concept: "Đếm quân giữa Pháo và mục tiêu",', 'concept: "Nhìn ngòi Pháo",'),
              ('"Đỏ đi. Pháo cần đúng một quân làm giá để bắt quân. Tìm nước bắt an toàn trong một lượt."', '"Đỏ đi. Pháo muốn ăn quân phải nhảy qua đúng một quân làm ngòi. Tìm nước ăn mà Pháo không bị ăn lại ngay."'),
              ('"Khi bắt quân, Pháo nhảy qua đúng một quân nằm giữa nó và mục tiêu."', '"Khi ăn quân, Pháo phải nhảy qua đúng một quân làm ngòi."'),
              ('"Nhìn cột h. Tốt đen cũng có thể làm giá cho Pháo đỏ."', '"Nhìn cột h. Tốt đen ở giữa có thể làm ngòi cho Pháo đỏ."'),
              ('"Pháo h2 bắt Xe h7 bằng cách nhảy qua Tốt h4. Đúng một quân làm giá; Đen không có nước bắt lại Pháo ngay lượt sau."', '"Pháo h2 ăn Xe h7 nhờ Tốt h4 làm ngòi. Sau nước này, Đen không ăn lại Pháo ngay được."'),
              ('concept: "Kiểm tra đường đi trước khi bắt",', 'concept: "Nhìn chân Mã trước khi ăn",'),
              ('"Đỏ đi. Tìm nước Mã bắt quân hợp lệ và kiểm tra khả năng đối phương bắt lại."', '"Đỏ đi. Tìm nước Mã ăn quân, rồi xem Đen có ăn lại Mã ngay được không."'),
              ('"Mã đi hai điểm theo một hướng rồi một điểm vuông góc. Quân ở chân Mã có thể chặn nước đi."', '"Mã đi theo hình chữ nhật. Nếu chân Mã bị chặn thì Mã không đi được hướng đó."'),
              ('"Thử Mã c1 → d3 để bắt Xe, rồi kiểm tra nước đáp của Đen."', '"Thử Mã c1 → d3 ăn Xe, rồi nhìn nước đáp của Đen."'),
              ('"Mã c1 bắt Xe d3 vì chân Mã ở c2 trống. Đen không có nước hợp lệ bắt lại Mã ngay lượt sau."', '"Mã c1 ăn Xe d3 vì chân Mã ở c2 đang thoáng. Đen không ăn lại Mã ngay được."'),
              ('concept: "Áp dụng mà chưa xem gợi ý",', 'concept: "Tự tìm ở một thế khác",'),
              ('"Đỏ đi. Dùng cách quan sát vừa luyện để tìm một nước bắt quân không bị bắt lại ngay."', '"Đỏ đi. Tự tìm một nước ăn quân mà quân vừa đi không bị ăn lại ngay."'),
              ('"Thử Xe h2 → c2, rồi kiểm tra các quân Đen còn lại."', '"Thử Xe h2 → c2 ăn Pháo, rồi nhìn xem Đen có ăn lại Xe được không."'),
              ('"Xe h2 bắt Pháo c2 theo hàng ngang không bị chắn. Đen không có nước bắt lại Xe ngay lượt sau trong thế này."', '"Xe h2 ăn Pháo c2 vì hàng ngang không bị chắn. Trong thế này, Đen không ăn lại Xe ngay được."'),
              ('message: "Nước hợp lệ. Hãy tìm một nước bắt quân.",', 'message: "Nước này đi được, nhưng chưa ăn quân.",'),
              ('"Mục tiêu bài này là quan sát quân có thể bắt, rồi kiểm tra nước bắt lại của đối phương."', '"Bài này chỉ cần: ăn một quân, rồi nhìn xem đối thủ có ăn lại quân vừa đi được không."'),
              ('message: "Đối phương có thể bắt lại quân vừa đi.",', 'message: "Đối thủ ăn lại được ngay.",'),
              ('`Hãy kiểm tra nước đáp ${recaptures[0].from} → ${recaptures[0].to}. Một nước bắt quân chưa chắc đã an toàn.`', '`Nhìn nước đáp ${recaptures[0].from} → ${recaptures[0].to}. Ăn được quân chưa chắc đã lời nếu quân vừa đi bị ăn lại ngay.`'),
              ('message: "Bạn đã tìm được nước bắt phù hợp.",', 'message: "Đúng rồi — nước này ăn quân mà không bị ăn lại ngay.",'),
              ('"Nước bắt hợp lệ và đối phương không có nước bắt lại ngay quân vừa đi. Đây là kết quả của bài quan sát một lượt, chưa phải kết luận tối ưu toàn ván."', '"Trong thế này, quân vừa đi không bị ăn lại ngay. Điều đó chưa có nghĩa đây là nước hay nhất của cả ván."'),
              ('"Bạn đã làm được nhưng có trợ giúp; thử lại để tạo bằng chứng độc lập."', '"Lần trước bạn cần gợi ý. Thử lại xem lần này có tự tìm ra không."'),
              ('"Bài nền tảng này chưa có lần thử nào."', '"Bài này bạn chưa thử. Làm một lần để quen cách nhìn."'),
              ('"Các bài nền tảng đã được xem; chuyển sang thế mới để kiểm tra khả năng áp dụng."', '"Bạn đã thử các bài cơ bản. Sang một thế mới để xem có tự nhận ra nước đi không."'),
              ('"Bài này chưa có lần đúng đầu tiên mà không dùng gợi ý hay lời giải."', '"Bài này bạn chưa tự làm đúng mà không cần gợi ý hay xem lời giải."'),
              ('text: "Trước khi xem biến thể, hãy tìm nước chiếu hoặc nước bắt quân mà đối phương có thể đáp lại.",', 'text: "Trước khi xem máy tính, thử tìm nước chiếu hoặc nước ăn quân và nghĩ xem đối thủ sẽ đáp thế nào.",'),
              ('text: result.moved.captured\n        ? "Bạn vừa bắt quân. Hãy kiểm tra xem quân vừa đi có bị bắt lại ngay không."\n        : "Sau nước vừa đi, quân nào của bạn đang có thể bị đối phương tấn công?",', 'text: result.moved.captured\n        ? "Bạn vừa ăn quân. Nhìn xem quân vừa đi có bị đối thủ ăn lại ngay không."\n        : "Sau nước vừa đi, quân nào của bạn đang bị đối thủ nhòm tới?",'),
              ('text: "Chọn thêm một nước ứng viên. Với mỗi nước, thử hình dung một nước đáp mạnh của đối phương rồi mới so sánh.",', 'text: "Tính thêm một nước nữa. Với mỗi nước, thử nghĩ nước đáp mạnh nhất của đối thủ rồi mới so sánh.",'),
          ])

          apply('src/retrieval.ts', [
              ('return "Nước bắt gần nhất bị đối phương bắt lại; ôn lại để tập kiểm tra nước đáp.";', 'return "Lần trước quân vừa ăn bị đối thủ ăn lại ngay. Ôn lại để tập nhìn nước đáp trước khi đi.";'),
              ('return "Lần gần nhất chưa tìm đúng nước bắt; ôn lại sau một khoảng nghỉ ngắn.";', 'return "Lần trước bạn chưa tìm đúng nước ăn quân. Nghỉ một chút rồi thử lại.";'),
              ('return "Đã xem lời giải; cần truy hồi lại sau khi trí nhớ ngắn hạn giảm bớt.";', 'return "Bạn đã xem lời giải. Để một lúc rồi tự tìm lại xem còn nhớ cách làm không.";'),
              ('return "Đã làm đúng với gợi ý; cần một lần tự làm độc lập sau đó.";', 'return "Lần trước bạn làm đúng nhờ gợi ý. Lần này thử tự tìm mà không mở gợi ý.";'),
              ('return "Đã làm đúng độc lập; lịch ôn được giãn ra để kiểm tra khả năng nhớ lâu hơn.";', 'return "Bạn đã tự làm đúng. Lần ôn sau sẽ cách xa hơn để xem còn nhớ cách nhìn không.";'),
          ])

          apply('src/App.tsx', [
              ('text: "Xe đỏ đã bắt Mã. Bây giờ hãy nhìn xem Đen có thể bắt lại Xe ngay hay không.",', 'text: "Xe đỏ vừa ăn Mã. Giờ nhìn xem Đen có quân nào ăn lại Xe ngay được không.",'),
              ('title: "Xác nhận nước bạn vừa chọn.",', 'title: "Đi nước này nhé.",'),
              ('text: "Bạn đã chọn Xe b0 → b3 để bắt Mã. Bấm ‘Thử nước này’ ở bảng bên phải.",', 'text: "Bạn đã chọn Xe b0 → b3 ăn Mã. Bấm ‘Đi nước này’ để xem Đen đáp ra sao.",'),
              ('title: "Bấm quân Mã đen để bắt.",', 'title: "Bấm Mã đen để ăn.",'),
              ('text: "Các điểm được đánh dấu là nơi Xe có thể đi. Bấm quân Mã 馬 ở b3.",', 'text: "Các chấm sáng là chỗ Xe đi được. Bấm quân Mã 馬 ở b3 để ăn quân.",'),
              ('? "BÀI LUYỆN NỀN TẢNG"\n                : "KHÔNG GIAN PHÂN TÍCH"', '? "BÀI NHẬP MÔN"\n                : "BÀN PHÂN TÍCH"'),
              ('? "Nhìn trước một nước."\n                : "Mỗi nước đi, một câu hỏi."', '? "Tập nhìn trước một nước."\n                : "Tự bày cờ và tính nước."'),
              ('? "Quan sát. Chọn nước. Kiểm tra cách đối phương đáp lại."\n                : "Thử các nước của cả hai bên, hoặc nhờ Pikafish đi tiếp."', '? "Ăn quân chưa đủ — hãy nhìn xem đối thủ đáp lại thế nào."\n                : "Đi thử các nước của hai bên, hoặc để Pikafish tính tiếp."'),
              ('Điểm đến hợp lệ', 'Ô đi được'),
              ('? "Đang nạp Pikafish và dữ liệu phân tích… Bạn có thể làm bài ngay."', '? "Đang nạp Pikafish… Bạn vẫn có thể làm bài ngay."'),
              ('? "Pikafish đang kiểm tra các biến thể…"', '? "Pikafish đang tính các nước…"'),
              (': "Pikafish sẵn sàng · Phân tích trực tiếp trên máy bạn"', ': "Pikafish đã sẵn sàng · tính trực tiếp trên máy bạn"'),
              ('? `${exercise.kind === "transfer" ? "TỰ KIỂM TRA" : "LUYỆN CÓ HƯỚNG DẪN"} · ${exerciseIndex + 1}/${EXERCISES.length}`', '? `${exercise.kind === "transfer" ? "TỰ LÀM" : "CÓ HƯỚNG DẪN"} · ${exerciseIndex + 1}/${EXERCISES.length}`'),
              (': "Chọn tối đa 3 nước ứng viên trước khi đi. Phân tích chỉ mở khi bạn muốn xem."', ': "Có thể tính trước tối đa 3 nước. Chỉ mở Pikafish khi bạn muốn xem."'),
              ('BẠN ĐANG CÂN NHẮC', 'CÁC NƯỚC ĐANG TÍNH'),
              ('{mode === "training" ? "Thử nước này" : "Đi nước này"}', '{mode === "training" ? "Đi nước này" : "Đi nước này"}'),
              ('<strong>Một chút gợi mở</strong>', '<strong>Gợi ý</strong>'),
              ('Chưa cần tìm nước hay nhất. Hãy bắt đầu từ những gì bạn nhìn\n                    thấy trên bàn.', 'Chưa cần tìm nước hay nhất. Trước hết nhìn xem quân nào đang có thể ăn quân đối thủ.'),
              ('? "Cho tôi một gợi ý"', '? "Gợi ý một chút"'),
              ('? "ĐANG CHỌN CÂU HỎI"', '? "ĐANG CHỌN GỢI Ý"'),
              ('? "CÂU HỎI DO AI CHỌN"', '? "GỢI Ý TỪ AI"'),
              (': "CÂU HỎI HƯỚNG DẪN"', ': "GỢI Ý LUYỆN CỜ"'),
              ('? "Hãy tự hình dung nước đáp của đối phương trong lúc chờ."', '? "Trong lúc chờ, thử nghĩ xem đối thủ sẽ đáp nước nào."'),
              ('? "Xem lời giải & phân tích"', '? "Xem lời giải và Pikafish"'),
          ])
          PY
      - name: Format and verify
        run: |
          npm ci
          npm run format
          npm run quality
      - name: Commit rewritten copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/training.ts src/retrieval.ts
          git commit -m "feat: rewrite Vietnamese Xiangqi copy naturally"
          git push origin HEAD:feat/natural-vietnamese-copy
