name: Verify Today Practice

on:
  push:
    branches: ["feat/today-practice-v1"]

permissions:
  contents: write

jobs:
  quality:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Persist reviewed positions into practice memory
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/PlayVsAI.tsx")
          text = path.read_text()

          old = '''} from "./gameReview";\nimport "./play.css";\n'''
          new = '''} from "./gameReview";\nimport {\n  GAME_PRACTICE_STORAGE_KEY,\n  ingestReviewMoment,\n  parsePracticeCards,\n} from "./practiceMemory";\nimport "./play.css";\n'''
          if old not in text:
              raise SystemExit("practice-memory import anchor missing")
          text = text.replace(old, new, 1)

          old = '''  function nextReviewMoment() {\n    if (!reviewMoments.length) return;\n'''
          new = '''  function revealReviewAnswer() {\n    if (!activeReview || !reviewGuess) return;\n    try {\n      const stored = parsePracticeCards(\n        localStorage.getItem(GAME_PRACTICE_STORAGE_KEY),\n      );\n      const next = ingestReviewMoment(\n        stored,\n        activeReview,\n        reviewGuess,\n        Date.now(),\n      );\n      localStorage.setItem(GAME_PRACTICE_STORAGE_KEY, JSON.stringify(next));\n    } catch {\n      setMessage(\n        "Đã mở đáp án nhưng trình duyệt không lưu được thế này vào lịch ôn.",\n      );\n    }\n    setReviewRevealed(true);\n  }\n\n  function nextReviewMoment() {\n    if (!reviewMoments.length) return;\n'''
          if old not in text:
              raise SystemExit("review function anchor missing")
          text = text.replace(old, new, 1)

          old = '''                          onClick={() => setReviewRevealed(true)}\n'''
          new = '''                          onClick={revealReviewAnswer}\n'''
          if old not in text:
              raise SystemExit("reveal button anchor missing")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Format today-practice source
        run: npx prettier --write src/practiceMemory.ts tests/practiceMemory.test.ts src/TodayPractice.tsx src/today.css src/Root.tsx src/PlayVsAI.tsx
      - name: Full quality gate
        run: npm run quality
      - name: Commit verified today-practice wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/practiceMemory.ts tests/practiceMemory.test.ts src/TodayPractice.tsx src/today.css src/Root.tsx src/PlayVsAI.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: connect post-game review to today practice"
            git push origin HEAD:feat/today-practice-v1
          fi
